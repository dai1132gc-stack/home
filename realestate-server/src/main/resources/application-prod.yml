spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
  file:
    name: ${LOG_ROOT:./logs}/realestate-server.log

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# 生产密钥必须来自环境变量：AppProperties 启动校验拒绝空值/内置开发默认值
