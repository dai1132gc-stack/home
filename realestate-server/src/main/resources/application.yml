spring:
  application:
    name: realestate-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Flyway 迁移，不依赖 Hibernate 自动建表
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 应用自定义属性（密钥等敏感值来自环境变量/.env，见 AppProperties 校验）
app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}
  cookie:
    # Web Refresh Cookie 的 Secure 属性：dev=false（http://localhost 可登录），prod 必须 true（仅 HTTPS）
    secure: ${APP_COOKIE_SECURE:false}
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    customer-password: ${BOOTSTRAP_CUSTOMER_PASSWORD:}
  wechat:
    # W5 微信小程序 code 登录：未配置时 /auth/wechat-login 返回 503，账号密码登录保持可用
    app-id: ${WECHAT_MINI_APP_ID:}
    app-secret: ${WECHAT_MINI_APP_SECRET:}
    timeout-seconds: ${WECHAT_MINI_TIMEOUT_SECONDS:4}
    api-base-url: ${WECHAT_MINI_API_BASE_URL:https://api.weixin.qq.com}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/uploads}
    private-root: ${STORAGE_PRIVATE_ROOT:uploads-private}
    max-image-size-bytes: ${STORAGE_MAX_IMAGE_SIZE_BYTES:10485760}
  contract:
    # W4 合同到期扫描（Asia/Shanghai），默认每日 01:10
    expiry-cron: ${CONTRACT_EXPIRY_CRON:0 10 1 * * *}
  ai:
    # W6 智能增强：enabled=false 时全部 AI 能力降级（选房走普通筛选，问答 503），无需任何凭据
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    timeout-ms: ${AI_TIMEOUT_MS:12000}
    max-input-chars: ${AI_MAX_INPUT_CHARS:200}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:800}
    daily-token-limit: ${AI_DAILY_TOKEN_LIMIT:100000}
    rate-limit-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
    top-k: ${AI_TOP_K:4}
    similarity-threshold: ${AI_SIMILARITY_THRESHOLD:0.30}
    concurrency: ${AI_CONCURRENCY:4}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
